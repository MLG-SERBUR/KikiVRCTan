name: Memory benchmark packages

on:
  push:
    branches: [memory-benchmark]

permissions:
  contents: read

jobs:
  package:
    name: Package WinForms and Uno hosts
    runs-on: windows-latest
    steps:
      - name: Checkout Uno host
        uses: actions/checkout@v4

      - name: Checkout last WinForms host revision
        uses: actions/checkout@v4
        with:
          ref: 3451b3713774f545ef337003072b0af7d0932438
          path: legacy

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish WinForms host
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          $winforms = Join-Path $env:RUNNER_TEMP "memory-benchmark\winforms"
          dotnet publish .\legacy\KikitanTranslator.WinForms\KikitanTranslator.WinForms.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $winforms
          if ($LASTEXITCODE -ne 0) { throw "WinForms publish failed" }

      - name: Publish Uno host
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          $uno = Join-Path $env:RUNNER_TEMP "memory-benchmark\uno"
          dotnet publish .\KikitanTranslator.Uno\KikitanTranslator.Uno.csproj -f net10.0-desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $uno
          if ($LASTEXITCODE -ne 0) { throw "Uno publish failed" }

      - name: Assemble benchmark package
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "memory-benchmark\package"
          $winforms = Join-Path $env:RUNNER_TEMP "memory-benchmark\winforms"
          $uno = Join-Path $env:RUNNER_TEMP "memory-benchmark\uno"
          New-Item -ItemType Directory -Force -Path (Join-Path $package "winforms"), (Join-Path $package "uno") | Out-Null
          Copy-Item (Join-Path $winforms "*") (Join-Path $package "winforms") -Recurse -Force
          Copy-Item (Join-Path $uno "*") (Join-Path $package "uno") -Recurse -Force
          Copy-Item ".\scripts\memory-benchmark.ps1" (Join-Path $package "memory-benchmark.ps1")
          @"
          WinForms source: 3451b3713774f545ef337003072b0af7d0932438
          Uno source: $env:GITHUB_SHA
          Overlay executables are excluded to isolate the host process.
          This is a test-only package. It does not publish to a GitHub Release or the app updater.
          "@ | Set-Content (Join-Path $package "build-info.txt")
          $zip = Join-Path $env:RUNNER_TEMP "memory-benchmark\KikiVRCTan-memory-benchmark.zip"
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $zip -Force

      - name: Upload benchmark package
        uses: actions/upload-artifact@v4
        with:
          name: KikiVRCTan-memory-benchmark
          path: ${{ runner.temp }}\memory-benchmark\KikiVRCTan-memory-benchmark.zip
          if-no-files-found: error
          retention-days: 30
