# FORK (feed-overlay): builds the native Uno host as a portable zip
# on a real Windows runner.

name: Build KikiVRCTan portable (fork)

on:
  push:
    branches: [feed-overlay]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed-tests:
    name: Feed pipe + renderer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feed-overlay

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run feed tests
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: dotnet run -c Release --project tests/FeedTests/FeedTests.csproj

      - name: Upload render outputs
        uses: actions/upload-artifact@v4
        with:
          name: feed-render-outputs
          path: tests/FeedTests/test-output/

  build-portable:
    name: Build portable zip
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feed-overlay

      # FORK: the Uno host needs SDK 10; the overlay (net9.0-windows) and
      # Base (net9.0) still target .NET 9, so install that SDK too for their
      # targeting packs. global.json pins the CLI to SDK 10.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # FORK: -f selects the Uno head's TFM for the top project only. Do NOT
      # pass -p:TargetFrameworks=net10.0-desktop: it flows into the net9.0
      # Base/Resources references as a global property and fails restore
      # with NETSDK1139 (that bad flag shipped the overlay-only zip once).
      # Each publish is checked explicitly: pwsh does not fail the step on
      # a native command's non-zero exit, so an unchecked failure would
      # silently ship a partial zip (the overlay publish alone succeeds).
      - name: Publish app (self-contained, single-file)
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          dotnet publish KikitanTranslator.Uno/KikitanTranslator.Uno.csproj -f net10.0-desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o KikitanTranslator.Uno/publish/app
          if ($LASTEXITCODE -ne 0) { throw "Uno publish failed" }
          dotnet publish KikitanTranslator.Overlay/KikitanTranslator.Overlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o KikitanTranslator.Uno/publish/app
          if ($LASTEXITCODE -ne 0) { throw "Overlay publish failed" }
          $env:GITHUB_SHA | Out-File -FilePath KikitanTranslator.Uno/publish/app/version.txt -NoNewline

      - name: Create portable zip
        run: |
          Compress-Archive -Path KikitanTranslator.Uno\publish\app\* -DestinationPath KikiVRCTan-portable.zip -Force
          Copy-Item KikitanTranslator.Uno\publish\app\version.txt -Destination version.txt

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: KikiVRCTan-portable
          path: KikiVRCTan-portable.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "feed-overlay-latest"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease `
              --title "KikiVRCTan (feed-overlay latest)" `
              --notes "Latest automated build of the feed-overlay branch. Download KikiVRCTan-portable.zip, extract anywhere, run KikiVRCTan.exe."
          }
          $release = gh api "repos/MLG-SERBUR/KikiVRCTan/releases/tags/$tag" | ConvertFrom-Json
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}', '?name=KikiVRCTan-portable.zip'
          $uploaded = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            $assets = gh api "repos/MLG-SERBUR/KikiVRCTan/releases/$($release.id)/assets" | ConvertFrom-Json
            if ($assets | Where-Object { $_.name -eq "KikiVRCTan-portable.zip" }) {
              gh release delete-asset $tag KikiVRCTan-portable.zip --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove the previous portable zip" }
            }
            curl.exe --fail-with-body --location --silent --show-error --request POST $uploadUrl `
              --header "Authorization: Bearer $env:GH_TOKEN" `
              --header "Accept: application/vnd.github+json" `
              --header "Content-Type: application/zip" `
              --data-binary "@KikiVRCTan-portable.zip"
            if ($LASTEXITCODE -eq 0) {
              $uploaded = $true
              break
            }
            if ($attempt -lt 4) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $uploaded) { throw "Portable zip upload failed after 4 attempts" }
          gh release upload $tag version.txt --clobber
